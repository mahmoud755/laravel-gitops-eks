apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-queue
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-queue
  template:
    metadata:
      labels:
        app: laravel-queue
    spec:
      containers:
        - name: worker
          image: 617287376010.dkr.ecr.us-east-1.amazonaws.com/laravel-app-image:v3
          command: ["sh", "-c"]
          args: ["php artisan queue:work --sleep=3 --tries=3 --timeout=90"]
          
          envFrom:
          - configMapRef:
              name: laravel-config
          - secretRef:
              name: db-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

